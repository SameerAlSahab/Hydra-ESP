name: Build, Release & Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a new GitHub Release"
        type: boolean
        default: false
      update_pages:
        description: "Deploy pages/ to GitHub Pages"
        type: boolean
        default: false
      version:
        description: "Version to release. (optional)"
        type: string
        required: false
        default: ""
      idf_version:
        description: "ESP-IDF version to build with"
        type: string
        required: false
        default: "v5.3.1"

env:
  DEFAULT_IDF_VERSION: "v5.3.1"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ github.event.inputs.idf_version || env.DEFAULT_IDF_VERSION }}
          target: esp32

      - name: Locate flashable binaries
        id: locate
        run: |
          set -e
          test -f build/bootloader/bootloader.bin
          test -f build/partition_table/partition-table.bin

          # Ask ESP-IDF for the real app binary name instead of guessing.
          # build/ also contains storage.bin, so a generic "find *.bin"
          # can pick the wrong file.
          APP_NAME=$(python3 -c "import json; print(json.load(open('build/project_description.json'))['app_bin'])")
          APP_BIN="build/$APP_NAME"
          if [ ! -f "$APP_BIN" ]; then
            echo "::error::App binary $APP_BIN not found"
            exit 1
          fi
          echo "app_bin=$APP_BIN" >> "$GITHUB_OUTPUT"

      - name: Package flashable files only
        run: |
          mkdir -p flash-package
          cp build/bootloader/bootloader.bin flash-package/
          cp build/partition_table/partition-table.bin flash-package/
          cp "${{ steps.locate.outputs.app_bin }}" flash-package/
          if [ -f build/storage.bin ]; then
            cp build/storage.bin flash-package/
          else
            echo "::warning::build/storage.bin not found, skipping (check if SPIFFS image name differs)"
          fi

          # Safety net: never publish a package missing a required file.
          cd flash-package
          for f in bootloader.bin partition-table.bin "$(basename "${{ steps.locate.outputs.app_bin }}")"; do
            test -f "$f" || { echo "::error::$f missing from package"; exit 1; }
          done
          zip -r ../hydra-esp-flash-files.zip .

      - name: Upload flash files artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydra-esp-flash-files
          path: hydra-esp-flash-files.zip
          retention-days: 30


  prepare-release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      new_name: ${{ steps.version.outputs.new_name }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine next version
        id: version
        run: |
          set -e
          git fetch --tags --force

          LATEST_TAG=$(git tag --sort=-creatordate | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.1.3"
          fi

          if ! git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            echo "::warning::Tag $LATEST_TAG not found after fetch — changelog may include full history"
          fi

          VER=$(echo "$LATEST_TAG" | sed -E 's/^[vV]//')
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          PATCH=$((PATCH + 1))
          AUTO_VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            # Extract a clean x.y.z (optionally v-prefixed) for the TAG.
            # Anything else in the input (e.g. " (Hotfix)") is kept only
            # in the release NAME, never in the tag.
            CLEAN_VERSION=$(echo "$INPUT_VERSION" | grep -oE '[vV]?[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
            if [ -z "$CLEAN_VERSION" ]; then
              echo "::error::Could not extract a valid x.y.z version from input '$INPUT_VERSION'"
              exit 1
            fi
            case "$CLEAN_VERSION" in
              v*|V*) NEW_TAG="$CLEAN_VERSION" ;;
              *) NEW_TAG="v$CLEAN_VERSION" ;;
            esac
            NEW_NAME="$INPUT_VERSION"
          else
            NEW_TAG="$AUTO_VERSION"
            NEW_NAME="$AUTO_VERSION"
          fi

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "new_name=$NEW_NAME" >> "$GITHUB_OUTPUT"

      - name: Build changelog since last tag
        id: changelog
        run: |
          LATEST_TAG="${{ steps.version.outputs.latest_tag }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            RANGE="${LATEST_TAG}..HEAD"
          else
            RANGE=""
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            FOUND=0
            while IFS='|' read -r full short subject; do
              [ -z "$full" ] && continue
              # Skip "readme: ..." and "readme(anything): ..." commits
              if echo "$subject" | grep -qiE '^readme(\([^)]*\))?:'; then
                continue
              fi
              # Turn "(#123)" into a linked PR reference
              linked_subject=$(printf '%s' "$subject" | sed -E "s|\(#([0-9]+)\)|([#\1](${REPO_URL}/pull/\1))|g")
              echo "- ${linked_subject} ([\`${short}\`](${REPO_URL}/commit/${full}))"
              FOUND=1
            done < <(git log $RANGE --no-merges --pretty=format:'%H|%h|%s')
            if [ "$FOUND" -eq 0 ]; then
              echo "_No notable changes._"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"


  publish-release:
    needs: [build, prepare-release]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download flash files artifact
        uses: actions/download-artifact@v4
        with:
          name: hydra-esp-flash-files
          path: .

      - name: Rename zip with version
        run: |
          mv hydra-esp-flash-files.zip \
             "hydra-esp-${{ needs.prepare-release.outputs.new_version }}-flash-files.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.new_version }}
          name: ${{ needs.prepare-release.outputs.new_name }}
          body: ${{ needs.prepare-release.outputs.changelog }}
          files: hydra-esp-${{ needs.prepare-release.outputs.new_version }}-flash-files.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Disable Jekyll
        run: touch pages/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "pages/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
